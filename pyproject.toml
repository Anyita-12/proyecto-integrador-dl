[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.1.0"
description = "Proyecto integrador 4.8: segmentación de instancias celulares (Sartorius), clasificación de texto (Jarvis) y MLOps"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
